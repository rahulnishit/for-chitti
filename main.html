<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe0e9;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            transition: all 0.5s ease;
        }

        h1 { color: #d63384; font-size: 1.8rem; }
        .gif { width: 150px; margin-bottom: 20px; }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
        }

        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #nextBtn, #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #888;
            color: white;
            position: absolute; /* Needed for the "run away" effect */
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="step1" class="container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG5tZ3pueG5tZ3pueG5tZ3pueG5tZ3pueG5tZ3pueG5tZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" class="gif" alt="Cute Cat">
        <h1>Hey, I have something to tell you...</h1>
        <button id="nextBtn" onclick="nextStep(2)">What is it? ❤️</button>
    </div>

    <div id="step2" class="container hidden">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNndueG5tZ3pueG5tZ3pueG5tZ3pueG5tZ3pueG5tZ3pueG5tZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9IbxxvDUQM/giphy.gif" class="gif" alt="Thinking Cat">
        <h1>I've been thinking about this for a while...</h1>
        <button id="nextBtn" onclick="nextStep(3)">Tell me!! ✨</button>
    </div>

    <div id="step3" class="container hidden">
        <img id="finalGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHpueG5tZ3pueG5tZ3pueG5tZ3pueG5tZ3pueG5tZ3pueG5tZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/KztT2c4u8mYYUiMKdJ/giphy.gif" class="gif" alt="Asking Cat">
        <h1 id="questionText">Will you be my Valentine? 🌹</h1>
        <div class="btn-container" style="height: 50px;">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="moveNoButton()">No</button>
        </div>
    </div>

    <script>
        function nextStep(step) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            
            document.getElementById('step' + step).classList.remove('hidden');
        }

        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            
            // Generate random coordinates within the screen
            // Subtracting some padding so it doesn't go off screen
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('questionText').innerText = "Yay! I knew you'd say yes! ❤️";
            document.getElementById('finalGif').src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHpueG5tZ3pueG5tZ3pueG5tZ3pueG5tZ3pueG5tZ3pueG5tZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/l41lTfuxZk7hndXG0/giphy.gif";
            document.getElementById('noBtn').style.display = 'none';
            document.getElementById('yesBtn').innerText = "I love you! 🥰";
            
            // Add some confetti effect (optional)
            for(let i=0; i<50; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.innerText = "❤️";
            confetti.style.position = 'fixed';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = '-20px';
            confetti.style.fontSize = Math.random() * 20 + 10 + 'px';
            confetti.style.zIndex = 999;
            confetti.style.transition = 'transform 2s linear, top 2s linear';
            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.style.top = '110vh';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            }, 10);

            setTimeout(() => {
                confetti.remove();
            }, 2000);
        }
    </script>
</body>
</html>
